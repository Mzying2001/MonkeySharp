name: Feature request / 功能建议
description: Suggest an improvement to MonkeySharp or its documentation. / 建议改进 MonkeySharp 或其文档。
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case and problem / 使用场景与问题
      description: Describe what you are trying to do and where the current behavior gets in the way. / 说明你想完成什么，以及当前行为带来了什么困难。
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior / 期望行为
      description: Describe what MonkeySharp should do in that situation. / 说明希望 MonkeySharp 在该场景下如何表现。
    validations:
      required: true
  - type: textarea
    id: alternatives-and-references
    attributes:
      label: Alternatives and references / 替代方案与参考资料
      description: Include any workarounds, related issues, or documentation you found. / 可以附上临时解决办法、相关 Issue 或文档。
