name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_call:
    inputs:
      package-version:
        description: NuGet version override; empty uses Version.props.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cefSharpVersion: ['84.4.10', '156.0.150']
        platform: [x64, x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.315

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run source checks
        shell: pwsh
        run: ./scripts/testing/Run-SourceTests.ps1 -Platform ${{ matrix.platform }} -CefSharpVersion ${{ matrix.cefSharpVersion }}

      - name: Upload source test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.cefSharpVersion }}-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: artifacts/source-tests/
          if-no-files-found: error

  real-chromium-e2e:
    needs: build-test
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cefSharpVersion: ['84.4.10', '156.0.150']
        platform: [x64, x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.315

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run native checks
        shell: pwsh
        run: ./scripts/testing/Run-NativeTests.ps1 -Platform ${{ matrix.platform }} -CefSharpVersion ${{ matrix.cefSharpVersion }}

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.cefSharpVersion }}-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: artifacts/native-tests/
          if-no-files-found: error

  packages:
    needs: [build-test, real-chromium-e2e]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.315

      - name: Build release packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: ./scripts/Build-Packages.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/packages

      - name: Test package publishing without network access
        shell: pwsh
        run: ./scripts/Test-PublishPackages.ps1 -PackageDirectory artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/packages.json
          if-no-files-found: error
