name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-test-pack:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore MonkeySharp.sln -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build MonkeySharp.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore --nologo

      - name: Test .NET
        run: dotnet test MonkeySharp.sln -c Release -p:Platform=${{ matrix.platform }} --no-build --nologo

      - name: Test JavaScript protocol
        run: node --test Mzying2001.MonkeySharp.Core.Tests/JavaScript/*.test.js

      - name: Pack Core
        if: matrix.platform == 'x64'
        run: dotnet pack Mzying2001.MonkeySharp.Core/Mzying2001.MonkeySharp.Core.csproj -c Release --no-build -o artifacts/packages/core --nologo

      - name: Pack CefSharp adapter
        run: dotnet pack Mzying2001.MonkeySharp.CefSharp/Mzying2001.MonkeySharp.CefSharp.csproj -c Release -p:Platform=${{ matrix.platform }} --no-build -o artifacts/packages/${{ matrix.platform }} --nologo

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: artifacts/packages/**/*.nupkg
