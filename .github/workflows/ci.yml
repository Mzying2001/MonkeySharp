name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-test-pack:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        cefSharpVersion: ['84.4.10', '121.3.70', '151.3.240']
        platform: [x64, x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.315

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore MonkeySharp.slnx -p:Platform=${{ matrix.platform }} -p:CefSharpVersion=${{ matrix.cefSharpVersion }}

      - name: Build
        run: dotnet build MonkeySharp.slnx -c Release -p:Platform=${{ matrix.platform }} -p:CefSharpVersion=${{ matrix.cefSharpVersion }} --no-restore --nologo

      - name: Test .NET
        run: dotnet test MonkeySharp.slnx -c Release -p:Platform=${{ matrix.platform }} -p:CefSharpVersion=${{ matrix.cefSharpVersion }} --no-build --nologo

      - name: Test JavaScript protocol
        run: node --test Mzying2001.MonkeySharp.Core.Tests/JavaScript/*.test.js

      - name: Pack Core
        if: matrix.platform == 'x64' && matrix.cefSharpVersion == '121.3.70'
        run: dotnet pack Mzying2001.MonkeySharp.Core/Mzying2001.MonkeySharp.Core.csproj -c Release -p:Platform=${{ matrix.platform }} -p:CefSharpVersion=${{ matrix.cefSharpVersion }} --no-build -o artifacts/packages/core --nologo

      - name: Pack CefSharp adapter
        if: matrix.platform == 'x64' && matrix.cefSharpVersion == '121.3.70'
        run: dotnet pack Mzying2001.MonkeySharp.CefSharp/Mzying2001.MonkeySharp.CefSharp.csproj -c Release -p:Platform=${{ matrix.platform }} -p:CefSharpVersion=${{ matrix.cefSharpVersion }} --no-build -o artifacts/packages/${{ matrix.platform }} --nologo

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'x64' && matrix.cefSharpVersion == '121.3.70'
        with:
          name: packages-${{ matrix.platform }}
          path: artifacts/packages/**/*.nupkg

  real-chromium-e2e:
    needs: build-test-pack
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        cefSharpVersion: ['84.4.10', '121.3.70', '151.3.240']
        platform: [x64, x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.315

      - name: Run CefSharp Chromium smoke
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          Mzying2001.MonkeySharp.CefSharp.SmokeHost/Run-E2E.ps1
          -Platform ${{ matrix.platform }}
          -CefSharpVersion ${{ matrix.cefSharpVersion }}

      - name: Run default WPF Demo Chromium smoke
        if: matrix.platform == 'x64' && matrix.cefSharpVersion == '121.3.70'
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          Mzying2001.MonkeySharp.Demo/Run-E2E.ps1
          -CefSharpVersion ${{ matrix.cefSharpVersion }}
