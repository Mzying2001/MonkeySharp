name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_call:
    inputs:
      package-version:
        description: NuGet version override; empty uses the Core project version.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        cefSharpVersion: ['84.4.10', '156.0.150']
        platform: [x64, x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.315

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore MonkeySharp.slnx -p:Platform=${{ matrix.platform }} -p:CefSharpVersion=${{ matrix.cefSharpVersion }}

      - name: Build
        run: dotnet build MonkeySharp.slnx -c Release -p:Platform=${{ matrix.platform }} -p:CefSharpVersion=${{ matrix.cefSharpVersion }} --no-restore --nologo

      - name: Test .NET
        run: dotnet test MonkeySharp.slnx -c Release -p:Platform=${{ matrix.platform }} -p:CefSharpVersion=${{ matrix.cefSharpVersion }} --no-build --nologo

      - name: Test JavaScript protocol
        run: node --test Mzying2001.MonkeySharp.Core.Tests/JavaScript/*.test.js

  real-chromium-e2e:
    needs: build-test
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        cefSharpVersion: ['84.4.10', '156.0.150']
        platform: [x64, x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.315

      - name: Run CefSharp Chromium smoke
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          Mzying2001.MonkeySharp.CefSharp.SmokeHost/Run-E2E.ps1
          -Platform ${{ matrix.platform }}
          -CefSharpVersion ${{ matrix.cefSharpVersion }}

      - name: Validate smoke result parser
        if: always()
        shell: pwsh
        run: ./Mzying2001.MonkeySharp.CefSharp.SmokeHost/Test-SmokeResults.ps1

      - name: Upload Chromium compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-${{ matrix.cefSharpVersion }}-${{ matrix.platform }}
          path: artifacts/smoke/${{ matrix.cefSharpVersion }}-${{ matrix.platform }}/
          if-no-files-found: error

      - name: Run WPF Demo Chromium baseline
        if: matrix.platform == 'x64'
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          Mzying2001.MonkeySharp.Demo/Run-E2E.ps1
          -CefSharpVersion ${{ matrix.cefSharpVersion }}

      - name: Upload Demo evidence
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.cefSharpVersion }}-x64
          path: artifacts/demo-smoke/
          if-no-files-found: error

  packages:
    needs: [build-test, real-chromium-e2e]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.315

      - name: Build release packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: ./scripts/Build-Packages.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/packages

      - name: Test package publishing without network access
        shell: pwsh
        run: ./scripts/Test-PublishPackages.ps1 -PackageDirectory artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/packages.json
          if-no-files-found: error
